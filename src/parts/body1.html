<body class="bg-surface-50 dark:bg-surface-950 text-slate-800 dark:text-slate-200 min-h-screen flex flex-col md:flex-row transition-colors duration-500 relative bg-pattern">

    <!-- PASSCODE LOCK SCREEN MODAL -->
    <div id="passcodeLockScreen" class="fixed inset-0 z-50 bg-surface-950/95 backdrop-blur-xl flex flex-col items-center justify-center p-4">
        <div class="premium-card p-10 max-w-md w-full text-center relative z-10">
            <div class="absolute inset-0 bg-gradient-to-br from-brand-500/5 to-transparent pointer-events-none"></div>
            <div class="w-24 h-24 bg-surface-900 border border-brand-500/30 text-brand-500 rounded-full flex items-center justify-center mx-auto mb-6 text-4xl shadow-[0_0_30px_rgba(201,164,107,0.15)]">
                <i class="fa-solid fa-lock"></i>
            </div>
            <h2 class="text-3xl font-display font-semibold mb-2 text-white tracking-wide">Secure Access</h2>
            <p class="text-sm text-slate-400 mb-8 font-light" id="passcodePromptText">Authenticate to access your portfolio</p>
            
            <div class="flex justify-center gap-3 mb-8" id="pinDots">
                <input type="password" maxlength="4" id="pinInput" class="w-40 text-center text-4xl tracking-[0.5em] py-3 rounded-2xl border border-surface-800 bg-surface-900/50 text-white focus:outline-none focus:border-brand-500 focus:ring-1 focus:ring-brand-500 transition-all shadow-inner" placeholder="••••" onkeypress="handlePasscodeEnter(event)" autofocus>
            </div>

            <p id="passcodeHintDisplay" class="text-xs text-brand-600 mb-6 hidden font-mono uppercase tracking-wider"></p>

            <div class="grid grid-cols-2 gap-4">
                <button onclick="unlockDashboard()" class="w-full py-3.5 bg-brand-600 hover:bg-brand-500 text-surface-950 font-bold rounded-xl transition-all shadow-[0_0_15px_rgba(201,164,107,0.3)] hover:shadow-[0_0_25px_rgba(201,164,107,0.5)]">Unlock</button>
                <button onclick="showPasscodeHint()" class="w-full py-3.5 bg-surface-800 text-slate-300 font-medium rounded-xl hover:bg-surface-700 hover:text-white transition-all border border-surface-700">Show Hint</button>
            </div>
        </div>
    </div>

    <!-- VERTICAL SIDEBAR NAVIGATION -->
    <aside id="mainSidebar" class="w-full md:w-72 glass flex flex-col justify-between shrink-0 z-30 transition-all md:min-h-screen p-6 pb-12 border-b md:border-b-0 md:border-r border-surface-800">
        <div class="space-y-6">
            <!-- Branding & Info - Refined Luxury Header -->
            <div class="flex flex-col pt-12 pb-5 relative">
                
                <div class="flex items-center gap-6 mb-2 pl-2">
                    <div class="relative group shrink-0 mt-1">
                        <!-- Diamond outer glow -->
                        <div class="absolute inset-0 bg-brand-500 blur-md opacity-40 rounded-xl rotate-45 group-hover:opacity-70 transition-opacity duration-500"></div>
                        <!-- Diamond shape container -->
                        <div class="relative w-10 h-10 bg-gradient-to-br from-surface-900 to-surface-950 border border-brand-500/60 rounded-xl shadow-2xl flex items-center justify-center rotate-45 transition-transform duration-700 group-hover:rotate-[135deg]">
                            <!-- Diamond Icon (Counter-rotated to stand upright) -->
                            <i class="fa-solid fa-gem text-brand-500 text-[15px] -rotate-45 transition-transform duration-700 group-hover:-rotate-[135deg]"></i>
                        </div>
                    </div>
                    <div>
                        <h1 class="font-display font-bold text-lg tracking-wider text-white uppercase" id="navAppName">Riyas Madathil</h1>
                        <p class="text-[9px] text-brand-500 font-mono tracking-[0.3em] uppercase opacity-90">Executive OS</p>
                        <!-- Minimal Location & Time Readout moved directly below Executive OS -->
                        <div class="mt-1.5 text-[10px] font-mono tracking-wider text-slate-400">
                            <span id="liveDateTime">--/--/----</span>
                        </div>
                        <div class="mt-2" id="cloudSyncStatusBadge" onclick="openCloudSyncModal()">
                            <span class="inline-flex items-center gap-1.5 px-2.5 py-0.5 rounded-lg bg-surface-900 border border-emerald-500/30 text-emerald-400 font-mono text-[9px] cursor-pointer hover:border-emerald-500">
                                <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse"></span> Firebase Live
                            </span>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Vertical Page Navigation Links with Container Border -->
            <div class="p-4 bg-surface-900/40 border border-surface-800 rounded-3xl shadow-inner space-y-2">
                <nav id="navPageTabs" class="flex flex-col gap-2">
                    <!-- Tabs rendered vertically via JS -->
                </nav>
            </div>
        </div>

        <!-- Sidebar Bottom Controls - Uniform Icon Grid -->
        <div class="pt-6 mt-6 pb-4 border-t border-surface-800/80">
            <div class="flex items-center justify-between px-1">
                <!-- Cloud Sync & Account -->
                <button onclick="openCloudSyncModal()" title="Cloud Sync & Account" class="w-9 h-9 rounded-xl bg-transparent hover:bg-surface-800/40 text-slate-500/70 hover:text-brand-500 transition-all flex items-center justify-center group">
                    <i class="fa-solid fa-cloud fa-fw text-sm group-hover:scale-110 transition-transform duration-300"></i>
                </button>
                <!-- Theme Toggle -->
                <button onclick="toggleTheme()" title="Toggle Theme" class="w-9 h-9 rounded-xl bg-transparent hover:bg-surface-800/40 text-slate-500/70 hover:text-brand-500 transition-all flex items-center justify-center group">
                    <i class="fa-solid fa-leaf fa-fw text-sm group-hover:-rotate-12 transition-transform duration-300" id="themeToggleIcon"></i>
                </button>
                <!-- Search -->
                <button onclick="openUniversalSearch()" title="Search" class="w-9 h-9 rounded-xl bg-transparent hover:bg-surface-800/40 text-slate-500/70 hover:text-brand-500 transition-all flex items-center justify-center group">
                    <i class="fa-solid fa-magnifying-glass fa-fw text-sm group-hover:scale-110 transition-transform duration-300"></i>
                </button>
                <!-- Passcode Settings -->
                <button onclick="openPasscodeModal()" title="Passcode Settings" class="w-9 h-9 rounded-xl bg-transparent hover:bg-surface-800/40 text-slate-500/70 hover:text-brand-500 transition-all flex items-center justify-center group">
                    <i class="fa-solid fa-fingerprint fa-fw text-sm group-hover:scale-110 transition-transform duration-300"></i>
                </button>
                <!-- Lock Screen -->
                <button onclick="lockDashboard()" title="Lock Screen" class="w-9 h-9 rounded-xl bg-transparent hover:bg-surface-800/40 text-slate-500/70 hover:text-brand-500 transition-all flex items-center justify-center group">
                    <i class="fa-solid fa-lock fa-fw text-sm group-hover:scale-110 transition-transform duration-300"></i>
                </button>
                <!-- Customize Menu -->
                <button onclick="openNavCustomizeModal()" title="Customize Menu" class="w-9 h-9 rounded-xl bg-transparent hover:bg-surface-800/40 text-slate-500/70 hover:text-brand-500 transition-all flex items-center justify-center group">
                    <i class="fa-solid fa-sliders fa-fw text-sm group-hover:-rotate-90 transition-transform duration-300"></i>
                </button>
            </div>
        </div>
    </aside>

    <!-- MAIN CONTENT CONTAINER -->
    <main class="flex-1 w-full mx-auto p-4 md:p-6 space-y-6 relative transition-all flex flex-col overflow-y-auto min-h-screen" id="appMainCanvas">

        <!-- GLOBAL EDITABLE BACKGROUND OVERLAY -->
        <div id="customBgOverlay" class="fixed inset-0 pointer-events-none -z-10 transition-all duration-700" style="background-size: cover; background-position: center; opacity: 0.05;"></div>

        <!-- PAGE 1: HOME -->
        <section id="page-home" class="page-view flex-1 flex flex-col">
            <div class="grid grid-cols-1 lg:grid-cols-3 gap-8 flex-1 items-stretch">
                
                <!-- Column 1: Profile Card -->
                <div class="premium-card p-10 flex flex-col items-center text-center group justify-between relative overflow-hidden h-full min-h-[500px]">
                    
                    <div class="absolute top-0 right-0 w-64 h-64 bg-brand-500/10 rounded-full blur-[80px] pointer-events-none"></div>

                    <div class="relative mb-8 mt-4">
                        <div class="absolute inset-0 bg-brand-500 blur-2xl opacity-20 rounded-full group-hover:opacity-40 transition-opacity duration-700"></div>
                        <img id="profilePhotoImg" src="https://placehold.co/200x200/0A140F/00FF9D?text=RM" class="w-40 h-40 rounded-full object-cover relative z-10 border border-brand-500/40 shadow-[0_0_40px_rgba(0,255,157,0.15)] p-1.5 bg-surface-900" alt="Profile">
                        <label for="profilePhotoInput" class="absolute bottom-2 right-2 p-3 bg-brand-600 text-surface-950 rounded-full cursor-pointer hover:bg-brand-500 shadow-[0_0_20px_rgba(0,255,157,0.5)] transition-all z-20 hover:scale-110">
                            <i class="fa-solid fa-camera text-sm"></i>
                            <input type="file" id="profilePhotoInput" accept="image/*" class="hidden" onchange="uploadProfilePhoto(event)">
                        </label>
                    </div>

                    <div class="my-auto space-y-2 w-full">
                        <h2 id="homeProfileName" class="font-display text-3xl font-bold text-white tracking-widest mb-2" contenteditable="true" onblur="saveHomeProfile()">Riyas Madathil</h2>
                        <p class="font-mono text-[10px] uppercase tracking-[0.3em] text-brand-500 mb-6">Executive Dashboard</p>
                        
                        <div class="h-px w-24 bg-gradient-to-r from-transparent via-brand-500/30 to-transparent mx-auto my-6"></div>
                        
                        <div class="p-4 rounded-2xl bg-surface-900/50 border border-surface-800 flex flex-col items-center gap-2">
                            <i class="fa-solid fa-phone text-slate-500 text-xs"></i>
                            <p id="homeProfilePhone" class="text-xs text-slate-300 font-mono tracking-wider whitespace-pre-wrap leading-relaxed text-center" contenteditable="true" onblur="saveHomeProfile()">+91 7559803371
+974 55003371</p>
                        </div>
                    </div>
                </div>

                <!-- Column 2: Notification Hub (Replaced Residences) -->
                <div class="premium-card p-6 flex flex-col group h-full min-h-[500px]">
                    <div class="flex flex-wrap items-center justify-between border-b border-surface-800 pb-4 mb-4 gap-3">
                        <h3 class="font-display text-lg text-white flex items-center gap-3">
                            <i class="fa-solid fa-inbox text-amber-400 text-sm"></i> Notification Hub
                            <span id="notificationBadge" class="hidden px-2 py-0.5 rounded-full bg-amber-500/20 text-amber-400 font-mono text-[10px] border border-amber-500/30">0</span>
                        </h3>
                        <div class="flex items-center gap-2">
                            <button onclick="markAllNotificationsRead()" class="opacity-0 group-hover:opacity-100 text-[10px] font-mono text-slate-400 hover:text-amber-400 transition-colors bg-surface-800/80 px-2.5 py-1 rounded-lg border border-surface-700">Mark Read</button>
                            <button onclick="clearAllNotifications()" class="opacity-0 group-hover:opacity-100 text-[10px] font-mono text-slate-400 hover:text-rose-400 transition-colors bg-surface-800/80 px-2.5 py-1 rounded-lg border border-surface-700">Clear</button>
                        </div>
                    </div>
                    <div id="notificationsList" class="flex-1 overflow-y-auto space-y-3 custom-scrollbar pr-2 max-h-[600px]">
                        <!-- Notifications injected via JS -->
                    </div>
                </div>

                <!-- Column 3: Vaults (Documents & Captures Stacked) -->
                <div class="flex flex-col gap-6 h-full min-h-[500px]">
                    <!-- Box 1: Documents -->
                    <div onclick="openStorageModal('documents')" class="premium-card p-6 cursor-pointer hover-lift flex flex-col justify-between group flex-1">
                        <div class="flex justify-between items-start mb-4">
                            <div class="p-3 bg-surface-800/50 border border-surface-700 text-accent-blue rounded-xl">
                                <i class="fa-regular fa-folder-open text-xl"></i>
                            </div>
                            <span class="text-surface-600 group-hover:text-brand-500 transition-colors">
                                <i class="fa-solid fa-arrow-up-right-from-square text-xs"></i>
                            </span>
                        </div>
                        <div>
                            <h4 class="font-display text-lg text-white mb-1">Documents Vault</h4>
                            <p class="text-[10px] font-mono uppercase tracking-wider text-slate-500" id="docCountText">0 Files Secured</p>
                        </div>
                    </div>

                    <!-- Box 2: Captures -->
                    <div onclick="openStorageModal('captures')" class="premium-card p-6 cursor-pointer hover-lift flex flex-col justify-between group flex-1">
                        <div class="flex justify-between items-start mb-4">
                            <div class="p-3 bg-surface-800/50 border border-surface-700 text-accent-cyan rounded-xl">
                                <i class="fa-solid fa-camera-retro text-xl"></i>
                            </div>
                            <span class="text-surface-600 group-hover:text-brand-500 transition-colors">
                                <i class="fa-solid fa-arrow-up-right-from-square text-xs"></i>
                            </span>
                        </div>
                        <div>
                            <h4 class="font-display text-lg text-white mb-1">Captures Vault</h4>
                            <p class="text-[10px] font-mono uppercase tracking-wider text-slate-500" id="captureCountText">0 Media Assets</p>
                        </div>
                    </div>
                </div>

            </div>

            <!-- Custom Navigation Titles Editor Toolbar -->
            <div id="homeStylingToolbar" class="premium-card p-8 hidden mt-8">
                <div class="flex items-center justify-between border-b border-surface-800 pb-4 mb-6">
                    <h4 class="font-mono text-[10px] uppercase tracking-[0.3em] text-brand-500 flex items-center gap-3">
                        <i class="fa-solid fa-sliders"></i> Customize Navigation Headings
                    </h4>
                    <button onclick="toggleHomeStylingBar()" class="text-slate-500 hover:text-white transition-colors"><i class="fa-solid fa-xmark text-lg"></i></button>
                </div>
                <div id="navEditorInputsContainer" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4 text-xs">
                    <!-- Dynamic inputs injected via JS -->
                </div>
                <div class="mt-6 pt-4 border-t border-surface-800 flex justify-end">
                    <button onclick="saveNavCustomization()" class="px-6 py-2.5 bg-brand-600 hover:bg-brand-500 text-surface-950 font-bold rounded-xl transition-all shadow-[0_0_15px_rgba(0,255,157,0.3)]">Save Headings</button>
                </div>
            </div>
        </section>
