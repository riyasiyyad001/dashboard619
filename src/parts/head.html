    <script>
        // Console filter for clean developer environment
        (function() {
            const _origError = console.error;
            const _origWarn = console.warn;
            function isMinorFirebaseNotice(args) {
                try {
                    const str = args.map(a => typeof a === 'object' ? (a?.message || a?.stack || a?.code || JSON.stringify(a) || '') : String(a)).join(' ');
                    return str.includes('maximum backoff delay');
                } catch(e) {
                    return false;
                }
            }
            console.error = function(...args) {
                if (isMinorFirebaseNotice(args)) return;
                _origError.apply(console, args);
            };
            console.warn = function(...args) {
                if (isMinorFirebaseNotice(args)) return;
                _origWarn.apply(console, args);
            };
        })();
    </script>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, getDoc, setDoc, deleteDoc, onSnapshot, disableNetwork, enableNetwork } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        window.addEventListener('unhandledrejection', function(event) {
            if (event && event.reason && (event.reason.code === 'resource-exhausted' || (event.reason.message && event.reason.message.includes('Quota limit exceeded')))) {
                event.preventDefault();
                if (typeof window.markQuotaExceeded === 'function') {
                    window.markQuotaExceeded();
                }
            }
        });
        window.addEventListener('error', function(event) {
            if (event && (event.message && (event.message.includes('Quota limit exceeded') || event.message.includes('resource-exhausted')))) {
                event.preventDefault();
                if (typeof window.markQuotaExceeded === 'function') {
                    window.markQuotaExceeded();
                }
            }
        });

        // Native IndexedDB Engine for Vault Files, Media Blobs & Complete Application State
        const VAULT_DB_NAME = 'ExecutiveVaultStorageDB';
        const VAULT_DB_VERSION = 2;
        const VAULT_STORE_NAME = 'vault_files';
        const STATE_STORE_NAME = 'app_state';

        function getVaultIndexedDB() {
            return new Promise((resolve) => {
                if (!window.indexedDB) {
                    resolve(null);
                    return;
                }
                const req = window.indexedDB.open(VAULT_DB_NAME, VAULT_DB_VERSION);
                req.onupgradeneeded = (e) => {
                    const idb = e.target.result;
                    if (!idb.objectStoreNames.contains(VAULT_STORE_NAME)) {
                        idb.createObjectStore(VAULT_STORE_NAME, { keyPath: 'id' });
                    }
                    if (!idb.objectStoreNames.contains(STATE_STORE_NAME)) {
                        idb.createObjectStore(STATE_STORE_NAME, { keyPath: 'key' });
                    }
                };
                req.onsuccess = () => resolve(req.result);
                req.onerror = (e) => {
                    console.warn('IndexedDB open error:', e);
                    resolve(null);
                };
            });
        }

        window.vaultStorage = {
            async saveState(stateObj) {
                if (!stateObj || typeof stateObj !== 'object') return;
                try {
                    const idb = await getVaultIndexedDB();
                    if (!idb) return;
                    return new Promise((resolve) => {
                        const tx = idb.transaction(STATE_STORE_NAME, 'readwrite');
                        const store = tx.objectStore(STATE_STORE_NAME);
                        store.put({
                            key: 'master_state',
                            data: JSON.parse(JSON.stringify(stateObj)),
                            updatedAt: stateObj.lastUpdatedAt || Date.now()
                        });
                        tx.oncomplete = () => resolve(true);
                        tx.onerror = () => resolve(false);
                    });
                } catch (e) {
                    console.warn('vaultStorage.saveState error:', e);
                }
            },
            async getState() {
                try {
                    const idb = await getVaultIndexedDB();
                    if (!idb) return null;
                    return new Promise((resolve) => {
                        const tx = idb.transaction(STATE_STORE_NAME, 'readonly');
                        const store = tx.objectStore(STATE_STORE_NAME);
                        const req = store.get('master_state');
                        req.onsuccess = () => resolve(req.result ? req.result.data : null);
                        req.onerror = () => resolve(null);
                    });
                } catch (e) {
                    console.warn('vaultStorage.getState error:', e);
                    return null;
                }
            },
            async saveFile(id, fileData) {
                if (!id || !fileData) return;
                try {
                    const idb = await getVaultIndexedDB();
                    if (!idb) return;
                    return new Promise((resolve) => {
                        const tx = idb.transaction(VAULT_STORE_NAME, 'readwrite');
                        const store = tx.objectStore(VAULT_STORE_NAME);
                        store.put({ id, fileData, updatedAt: Date.now() });
                        tx.oncomplete = () => resolve(true);
                        tx.onerror = () => resolve(false);
                    });
                } catch (e) {
                    console.warn('vaultStorage.saveFile error:', e);
                }
            },
            async getFile(id) {
                if (!id) return null;
                try {
                    const idb = await getVaultIndexedDB();
                    if (!idb) return null;
                    return new Promise((resolve) => {
                        const tx = idb.transaction(VAULT_STORE_NAME, 'readonly');
                        const store = tx.objectStore(VAULT_STORE_NAME);
                        const req = store.get(id);
                        req.onsuccess = () => resolve(req.result ? req.result.fileData : null);
                        req.onerror = () => resolve(null);
                    });
                } catch (e) {
                    console.warn('vaultStorage.getFile error:', e);
                    return null;
                }
            },
            async deleteFile(id) {
                if (!id) return;
                try {
                    const idb = await getVaultIndexedDB();
                    if (!idb) return;
                    return new Promise((resolve) => {
                        const tx = idb.transaction(VAULT_STORE_NAME, 'readwrite');
                        const store = tx.objectStore(VAULT_STORE_NAME);
                        store.delete(id);
                        tx.oncomplete = () => resolve(true);
                        tx.onerror = () => resolve(false);
                    });
                } catch (e) {
                    console.warn('vaultStorage.deleteFile error:', e);
                }
            }
        };

        const firebaseConfig = {
            projectId: "my-dashboard-520e7",
            appId: "1:994052346312:web:3739f06787d1e397cfb0fd",
            apiKey: "AIzaSyBs9IjimsJqaRlvFJbxga6QlmN7ZW0T3mQ",
            authDomain: "my-dashboard-520e7.firebaseapp.com",
            firestoreDatabaseId: "ai-studio-financialpersona-04f91bf6-bbd6-4d70-b5b0-5402303991cb",
            storageBucket: "my-dashboard-520e7.firebasestorage.app",
            messagingSenderId: "994052346312"
        };
        
        window.isFirebaseReady = false;
        window.firebaseUser = null;
        window.authInstance = null;

        try {
            const app = initializeApp(firebaseConfig);
            const auth = getAuth(app);
            window.authInstance = auth;
            const dbStore = getFirestore(app, firebaseConfig.firestoreDatabaseId);
            window.dbStore = dbStore;

            window.signInWithGoogle = async function() {
                try {
                    const provider = new GoogleAuthProvider();
                    const result = await signInWithPopup(auth, provider);
                    window.firebaseUser = result.user;
                    if (window.showToast) window.showToast("Signed in as " + (result.user.email || result.user.displayName), "success");
                    return result.user;
                } catch (e) {
                    console.error("Google Sign-In Error:", e);
                    if (window.showToast) window.showToast("Google Sign-In failed: " + e.message, "error");
                    throw e;
                }
            };

            window.signOutGoogle = async function() {
                try {
                    await signOut(auth);
                    await signInAnonymously(auth);
                    if (window.showToast) window.showToast("Signed out", "info");
                } catch (e) {
                    console.error("Sign-out error:", e);
                }
            };

            window.isFirestoreQuotaExceeded = false;
            window.firestoreQuotaExceededUntil = 0;
            try { localStorage.removeItem('firestore_quota_exceeded_until'); } catch(e) {}

            window.resetQuotaStatus = async function() {
                window.isFirestoreQuotaExceeded = false;
                window.firestoreQuotaExceededUntil = 0;
                try { localStorage.removeItem('firestore_quota_exceeded_until'); } catch(e) {}
                if (dbStore) {
                    try { await enableNetwork(dbStore); } catch(e) {}
                }
                setupMasterRealtimeSync();
                updateCloudSyncStatusUI('synced');
                if (window.showToast) window.showToast("Real-time Cloud Sync Active", "success");
            };

            async function markQuotaExceeded(durationMs = 15 * 1000) {
                // Short transient backoff in case of network throttle
                window.isFirestoreQuotaExceeded = true;
                window.firestoreQuotaExceededUntil = Date.now() + durationMs;
                setTimeout(async () => {
                    window.isFirestoreQuotaExceeded = false;
                    if (dbStore) {
                        try { await enableNetwork(dbStore); } catch(e) {}
                    }
                    setupMasterRealtimeSync();
                }, durationMs);
            }
            window.markQuotaExceeded = markQuotaExceeded;

            window.initCloudStorage = function() {
                return new Promise((resolve) => {
                    if (dbStore) {
                        try { enableNetwork(dbStore).catch(() => {}); } catch(e) {}
                    }
                    onAuthStateChanged(auth, async (user) => {
                        if (user) {
                            window.firebaseUser = user;
                            window.isFirebaseReady = true;
                            updateCloudSyncStatusUI('synced');
                            setupMasterRealtimeSync();
                            resolve(true);
                        } else {
                            try {
                                const cred = await signInAnonymously(auth);
                                window.firebaseUser = cred.user;
                                window.isFirebaseReady = true;
                                updateCloudSyncStatusUI('synced');
                                setupMasterRealtimeSync();
                                resolve(true);
                            } catch (err) {
                                console.warn("Firebase Anonymous Auth fallback:", err);
                                updateCloudSyncStatusUI('offline');
                                resolve(false);
                            }
                        }
                    });
                });
            };

            let unsubscribeSnapshot = null;
            function setupMasterRealtimeSync() {
                if (window.isFirestoreQuotaExceeded && Date.now() < window.firestoreQuotaExceededUntil) return;
                try {
                    if (unsubscribeSnapshot) unsubscribeSnapshot();
                    const masterDocRef = doc(dbStore, 'app_data', 'executive_master');
                    unsubscribeSnapshot = onSnapshot(masterDocRef, async (snap) => {
                        if (snap.exists()) {
                            const data = snap.data();
                            if (data) {
                                try {
                                    let parsed = null;
                                    if (data.isChunked && data.totalChunks > 1) {
                                        let fullPayload = data.payload || '';
                                        for (let i = 1; i < data.totalChunks; i++) {
                                            const chunkRef = doc(dbStore, 'app_data', `executive_master_part_${i}`);
                                            const cSnap = await getDoc(chunkRef);
                                            if (cSnap.exists()) {
                                                fullPayload += (cSnap.data().payload || '');
                                            }
                                        }
                                        parsed = JSON.parse(fullPayload);
                                    } else if (data.payload) {
                                        parsed = JSON.parse(data.payload);
                                    }
                                    if (parsed && window.onRemoteStateUpdate) {
                                        window.onRemoteStateUpdate(parsed);
                                    }
                                } catch (e) {
                                    console.error("Payload parse error in realtime listener:", e);
                                }
                            }
                        }
                    }, (err) => {
                        if (err && (err.code === 'resource-exhausted' || (err.message && err.message.includes('Quota limit exceeded')))) {
                            markQuotaExceeded();
                            if (unsubscribeSnapshot) {
                                unsubscribeSnapshot();
                                unsubscribeSnapshot = null;
                            }
                        } else {
                            console.warn("Firestore snapshot listener:", err);
                        }
                    });
                } catch (e) {
                    console.error("Realtime sync setup error:", e);
                }
            }

            let lastSavedPayloadStr = '';
            let cloudSaveTimer = null;
            const alreadyUploadedVaultDocIds = new Set();

            window.deleteVaultFileFromCloud = async function(docId) {
                if (!window.isFirebaseReady || !docId) return;
                alreadyUploadedVaultDocIds.delete(docId);
                if (window.isFirestoreQuotaExceeded && Date.now() < window.firestoreQuotaExceededUntil) return;
                try {
                    const fileRef = doc(window.dbStore, 'vault_files', docId);
                    await deleteDoc(fileRef);
                } catch (e) {
                    if (e && (e.code === 'resource-exhausted' || (e.message && e.message.includes('Quota limit exceeded')))) {
                        markQuotaExceeded();
                    } else {
                        console.warn("Cloud delete vault file warning:", e);
                    }
                }
            };

            window.getOrFetchVaultFile = async function(docId) {
                if (!docId) return null;
                // 1. Check in-memory in db.documents
                if (window.db && Array.isArray(window.db.documents)) {
                    const d = window.db.documents.find(x => x.id === docId);
                    if (d && d.fileData) return d.fileData;
                }
                // 2. Check IndexedDB cache
                if (window.vaultStorage) {
                    const cached = await window.vaultStorage.getFile(docId);
                    if (cached) {
                        if (window.db && Array.isArray(window.db.documents)) {
                            const d = window.db.documents.find(x => x.id === docId);
                            if (d) d.fileData = cached;
                        }
                        return cached;
                    }
                }
                // 3. Fetch from Firestore vault_files collection (if quota permits)
                if (window.dbStore && window.isFirebaseReady) {
                    if (window.isFirestoreQuotaExceeded && Date.now() < window.firestoreQuotaExceededUntil) {
                        return null;
                    }
                    try {
                        const fileRef = doc(window.dbStore, 'vault_files', docId);
                        const snap = await getDoc(fileRef);
                        if (snap.exists()) {
                            const fData = snap.data().fileData;
                            if (fData) {
                                alreadyUploadedVaultDocIds.add(docId);
                                if (window.vaultStorage) await window.vaultStorage.saveFile(docId, fData);
                                if (window.db && Array.isArray(window.db.documents)) {
                                    const d = window.db.documents.find(x => x.id === docId);
                                    if (d) d.fileData = fData;
                                }
                                return fData;
                            }
                        }
                    } catch (err) {
                        if (err && (err.code === 'resource-exhausted' || (err.message && err.message.includes('Quota limit exceeded')))) {
                            markQuotaExceeded();
                        } else {
                            console.warn("Firestore get vault file warning:", err);
                        }
                    }
                }
                return null;
            };

            async function executeDirectCloudSave(data) {
                if (!window.isFirebaseReady || !window.firebaseUser) return;
                
                // Check quota circuit breaker
                if (window.isFirestoreQuotaExceeded && Date.now() < window.firestoreQuotaExceededUntil) {
                    updateCloudSyncStatusUI('quota-exceeded');
                    return;
                }

                try {
                    updateCloudSyncStatusUI('saving');
                    const nowIso = new Date().toISOString();
                    const userEmail = window.firebaseUser.email || (window.firebaseUser.isAnonymous ? 'Anonymous Device' : window.firebaseUser.uid);
                    
                    // 1. Separate heavy document binaries (fileData) into local IndexedDB and vault_files collection
                    const cleanData = JSON.parse(JSON.stringify(data));
                    
                    if (Array.isArray(cleanData.documents)) {
                        for (let i = 0; i < cleanData.documents.length; i++) {
                            const d = cleanData.documents[i];
                            if (d.fileData && (d.fileData.startsWith('data:') || d.fileData.length > 2000)) {
                                // Cache locally in IndexedDB
                                if (window.vaultStorage) {
                                    await window.vaultStorage.saveFile(d.id, d.fileData);
                                }
                                // Upload file binary to dedicated Firestore vault_files only if not already uploaded
                                if (!alreadyUploadedVaultDocIds.has(d.id)) {
                                    try {
                                        if (d.fileData.length <= 950000) {
                                            const fileDocRef = doc(window.dbStore, 'vault_files', d.id);
                                            await setDoc(fileDocRef, {
                                                docId: d.id,
                                                fileData: d.fileData,
                                                mimeType: d.mimeType || 'application/octet-stream',
                                                userId: window.firebaseUser.uid,
                                                updatedAt: nowIso
                                            });
                                            alreadyUploadedVaultDocIds.add(d.id);
                                        }
                                    } catch (fErr) {
                                        if (fErr && (fErr.code === 'resource-exhausted' || (fErr.message && fErr.message.includes('Quota limit exceeded')))) {
                                            markQuotaExceeded();
                                            return;
                                        }
                                        console.warn("Vault file upload warning:", fErr);
                                    }
                                }
                                // Strip bulky binary string from consolidated master state
                                d.hasBinary = true;
                                delete d.fileData;
                            }
                        }
                    }

                    // Also clean vault captures if any
                    if (cleanData.vault && Array.isArray(cleanData.vault.captures)) {
                        for (let i = 0; i < cleanData.vault.captures.length; i++) {
                            const c = cleanData.vault.captures[i];
                            if (c.data && (c.data.startsWith('data:') || c.data.length > 2000)) {
                                if (window.vaultStorage) {
                                    await window.vaultStorage.saveFile(c.id, c.data);
                                }
                                delete c.data;
                                c.hasBinary = true;
                            }
                        }
                    }

                    const payloadStr = JSON.stringify(cleanData);

                    // Skip remote write if identical to last successfully synced payload
                    if (payloadStr === lastSavedPayloadStr) {
                        updateCloudSyncStatusUI('synced');
                        return;
                    }

                    // 2. Safe Master Payload Saving (Chunking if ever > 600KB)
                    const CHUNK_SIZE = 600000;
                    const totalChunks = Math.ceil(payloadStr.length / CHUNK_SIZE);

                    if (totalChunks <= 1) {
                        const masterDocRef = doc(window.dbStore, 'app_data', 'executive_master');
                        await setDoc(masterDocRef, {
                            userId: window.firebaseUser.uid,
                            updatedBy: userEmail,
                            payload: payloadStr,
                            isChunked: false,
                            totalChunks: 1,
                            chunkIndex: 0,
                            updatedAt: nowIso
                        });
                    } else {
                        for (let i = 0; i < totalChunks; i++) {
                            const chunkStr = payloadStr.substr(i * CHUNK_SIZE, CHUNK_SIZE);
                            const chunkDocId = i === 0 ? 'executive_master' : `executive_master_part_${i}`;
                            const chunkRef = doc(window.dbStore, 'app_data', chunkDocId);
                            await setDoc(chunkRef, {
                                userId: window.firebaseUser.uid,
                                updatedBy: userEmail,
                                payload: chunkStr,
                                isChunked: true,
                                chunkIndex: i,
                                totalChunks: totalChunks,
                                updatedAt: nowIso
                            });
                        }
                    }

                    lastSavedPayloadStr = payloadStr;
                    window.isFirestoreQuotaExceeded = false;
                    try { localStorage.removeItem('firestore_quota_exceeded_until'); } catch(e) {}
                    updateCloudSyncStatusUI('synced');
                } catch (e) {
                    if (e && (e.code === 'resource-exhausted' || (e.message && e.message.includes('Quota limit exceeded')))) {
                        markQuotaExceeded();
                        console.warn("Firestore Daily Quota Reached: Application state is securely preserved locally.");
                    } else {
                        console.error("Cloud Save Error:", e);
                        updateCloudSyncStatusUI('error');
                    }
                }
            }

            window.cloudSave = function(data, immediate = false) {
                if (cloudSaveTimer) {
                    clearTimeout(cloudSaveTimer);
                    cloudSaveTimer = null;
                }
                if (immediate) {
                    return executeDirectCloudSave(data);
                }
                return new Promise((resolve) => {
                    cloudSaveTimer = setTimeout(async () => {
                        await executeDirectCloudSave(data);
                        resolve();
                    }, 1200);
                });
            };

            window.cloudLoad = async function() {
                if (!window.isFirebaseReady || !window.firebaseUser) return null;
                if (window.isFirestoreQuotaExceeded && Date.now() < window.firestoreQuotaExceededUntil) return null;
                try {
                    // Try master document first
                    const masterDocRef = doc(window.dbStore, 'app_data', 'executive_master');
                    const snap = await getDoc(masterDocRef);
                    if (snap.exists()) {
                        const data = snap.data();
                        if (data.isChunked && data.totalChunks > 1) {
                            let fullPayload = data.payload || '';
                            for (let i = 1; i < data.totalChunks; i++) {
                                const chunkRef = doc(window.dbStore, 'app_data', `executive_master_part_${i}`);
                                const cSnap = await getDoc(chunkRef);
                                if (cSnap.exists()) {
                                    fullPayload += (cSnap.data().payload || '');
                                }
                            }
                            lastSavedPayloadStr = fullPayload;
                            return JSON.parse(fullPayload);
                        } else if (data.payload) {
                            lastSavedPayloadStr = data.payload;
                            return JSON.parse(data.payload);
                        }
                    }
                } catch (e) {
                    if (e && (e.code === 'resource-exhausted' || (e.message && e.message.includes('Quota limit exceeded')))) {
                        markQuotaExceeded();
                    } else {
                        console.error("Cloud Load Error:", e);
                    }
                }
                return null;
            };

            function updateCloudSyncStatusUI(status) {
                const el = document.getElementById('cloudSyncStatusBadge');
                if (!el) return;
                let email = 'riyasiyyad';
                if (window.firebaseUser && window.firebaseUser.email) {
                    email = window.firebaseUser.email.split('@')[0];
                }
                if (status === 'quota-exceeded' || (window.isFirestoreQuotaExceeded && Date.now() < window.firestoreQuotaExceededUntil)) {
                    el.innerHTML = `<span class="w-2 h-2 rounded-full bg-amber-400 shrink-0"></span> <span class="text-amber-300 font-mono text-[10px] truncate max-w-[170px]" title="Daily Firebase write quota reached. Local device copy is 100% saved & up to date. Resets in 24 hours.">Quota Limit (Local Safe)</span> <i class="fa-solid fa-hard-drive text-xs text-amber-400 ml-auto shrink-0 opacity-80" title="Saved locally on device"></i>`;
                    el.className = 'w-full flex items-center gap-2 px-3 py-2 rounded-xl bg-surface-950/80 border border-amber-500/40 cursor-pointer hover:border-amber-500 transition-all duration-300 shadow-sm';
                } else if (status === 'synced') {
                    el.innerHTML = `<span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse shrink-0"></span> <span class="text-slate-200 font-mono text-[10px] truncate max-w-[170px]" title="Cloud Synced (${email})">Cloud Synced (${email})</span> <i class="fa-solid fa-cloud text-xs text-emerald-400 ml-auto shrink-0 opacity-75"></i>`;
                    el.className = 'w-full flex items-center gap-2 px-3 py-2 rounded-xl bg-surface-950/80 border border-emerald-500/40 cursor-pointer hover:border-emerald-500 transition-all duration-300 shadow-sm';
                } else if (status === 'saving') {
                    el.innerHTML = '<i class="fa-solid fa-spinner fa-spin text-brand-500 text-xs shrink-0"></i> <span class="text-brand-400 font-mono text-[10px] truncate">Syncing to Cloud...</span>';
                    el.className = 'w-full flex items-center gap-2 px-3 py-2 rounded-xl bg-surface-950/80 border border-brand-500/40 transition-all duration-300 shadow-sm';
                } else if (status === 'error') {
                    el.innerHTML = '<span class="w-2 h-2 rounded-full bg-rose-400 shrink-0"></span> <span class="text-rose-400 font-mono text-[10px] truncate">Local Device Saved</span> <i class="fa-solid fa-hard-drive text-xs text-slate-400 ml-auto shrink-0 opacity-60"></i>';
                    el.className = 'w-full flex items-center gap-2 px-3 py-2 rounded-xl bg-surface-950/80 border border-rose-500/40 transition-all duration-300 shadow-sm';
                } else {
                    el.innerHTML = `<span class="w-2 h-2 rounded-full bg-emerald-400 shrink-0"></span> <span class="text-slate-300 font-mono text-[10px] truncate">Cloud Synced (${email})</span> <i class="fa-solid fa-cloud text-xs text-slate-400 ml-auto shrink-0 opacity-60"></i>`;
                    el.className = 'w-full flex items-center gap-2 px-3 py-2 rounded-xl bg-surface-950/80 border border-surface-800 cursor-pointer hover:border-surface-700 transition-all duration-300 shadow-sm';
                }
            }
        } catch (err) {
            console.error("Firebase init failed:", err);
        }
    </script>
